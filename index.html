
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TimeWinder 2027 – Program</title>

<style>

/* ==================================
   TIMEWINDER PROGRAM
================================== */

.tw-program {
    font-family: Arial, Helvetica, sans-serif;
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    color: #292929;
    box-sizing: border-box;
}

.tw-program *,
.tw-program *::before,
.tw-program *::after {
    box-sizing: border-box;
}

/* ==================================
   DAGSKNAPPER
================================== */

.tw-program .day-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.tw-program .day-tabs input {
    display: none;
}

.tw-program .day-tabs label {
    flex: 1;
    min-width: 100px;
    text-align: center;
    background: #F58114;
    color: #ffffff;
    padding: 13px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    transition: background 0.2s ease;
}

.tw-program .day-tabs label:hover {
    background: #D96F0D;
}

/* Aktiv dag */

#tw-friday:checked ~ .day-tabs label[for="tw-friday"],
#tw-saturday:checked ~ .day-tabs label[for="tw-saturday"],
#tw-sunday:checked ~ .day-tabs label[for="tw-sunday"] {
    background: #C96B12;
}

/* ==================================
   PROGRAMINDHOLD
================================== */

.tw-program .day-content {
    display: none;
}

#tw-friday:checked ~ .program-content .friday,
#tw-saturday:checked ~ .program-content .saturday,
#tw-sunday:checked ~ .program-content .sunday {
    display: block;
}

.tw-program .day-heading {
    font-size: 23px;
    font-weight: bold;
    margin: 0 0 18px 0;
    color: #292929;
}

/* ==================================
   PROGRAMTABEL
================================== */

.tw-program .program-tabel {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.tw-program .program-tabel th {
    text-align: left;
    padding: 12px 10px;
    background: #F58114;
    color: #ffffff;
    font-weight: bold;
}

.tw-program .program-tabel th:first-child {
    width: 20%;
}

.tw-program .program-tabel th:nth-child(2) {
    width: 70%;
}

.tw-program .program-tabel th:last-child {
    width: 10%;
    text-align: center;
}

.tw-program .program-tabel td {
    padding: 15px 10px;
    border-bottom: 1px solid #dddddd;
    vertical-align: top;
}

.tw-program .program-tabel tr:hover {
    background: #fff8f1;
}

/* Tid */

.tw-program .program-tid {
    font-weight: 900;
    white-space: nowrap;
}

/* Aktivitet */

.tw-program .program-aktivitet {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 5px;
}

/* Lokation */

.tw-program .program-lokation {
    font-size: 13px;
    font-weight: normal;
    color: #555555;
    display: flex;
    align-items: center;
    gap: 5px;
}

/* Lokationsikon – indbygget SVG */

.tw-program .location-icon {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
}

/* Emoji */

.tw-program .program-emoji {
    text-align: center;
    font-size: 22px;
    vertical-align: top;
}

/* ==================================
   MOBILVISNING
================================== */

@media (max-width: 600px) {

    .tw-program .day-tabs {
        gap: 6px;
        margin-bottom: 20px;
    }

    .tw-program .day-tabs label {
        min-width: 0;
        padding: 12px 6px;
        font-size: 14px;
    }

    .tw-program .day-heading {
        font-size: 20px;
    }

    /* Tabellen bliver til aktivitetskort */

    .tw-program .program-tabel,
    .tw-program .program-tabel tbody {
        display: block;
        width: 100%;
    }

    .tw-program .program-tabel thead {
        display: none;
    }

    .tw-program .program-tabel tr {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        width: 100%;
        padding: 12px 0;
        margin: 0;
        border-bottom: 1px solid #dddddd;
    }

    .tw-program .program-tabel td {
        display: block;
        width: 100% !important;
        border: none;
        padding: 3px 5px;
        box-shadow: none;
    }

    /* Tid øverst til venstre */

    .tw-program .program-tabel td:first-child {
        grid-column: 1;
        grid-row: 1;
        font-weight: 900;
        padding-bottom: 4px;
    }

    /* Aktivitet og lokation nedenunder */

    .tw-program .program-tabel td:nth-child(2) {
        grid-column: 1;
        grid-row: 2;
    }

    /* Emoji øverst til højre */

    .tw-program .program-tabel td:last-child {
        grid-column: 2;
        grid-row: 1 / span 2;
        text-align: right;
        padding: 3px 8px 0 10px;
        font-size: 22px;
        white-space: nowrap;
    }

    .tw-program .program-aktivitet {
        font-size: 15px;
    }

    .tw-program .program-lokation {
        font-size: 13px;
    }

}

</style>
</head>

<body>

<div class="tw-program">

    <!-- DAGSVÆLGER -->

    <input type="radio" name="tw-day" id="tw-friday" checked>
    <input type="radio" name="tw-day" id="tw-saturday">
    <input type="radio" name="tw-day" id="tw-sunday">

    <div class="day-tabs">
        <label for="tw-friday">Fredag</label>
        <label for="tw-saturday">Lørdag</label>
        <label for="tw-sunday">Søndag</label>
    </div>

    <!-- PROGRAM -->

    <div class="program-content">

        <!-- FREDAG -->

        <div class="day-content friday">

            <h2 class="day-heading">Fredag 14. maj 2027</h2>

            <table class="program-tabel">
                <thead>
                    <tr>
                        <th>Tid</th>
                        <th>Aktivitet</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td class="program-tid">10.00</td>
                        <td>
                            <div class="program-aktivitet">
                                TimeWinder åbner
                            </div>

                            <div class="program-lokation">
                                <svg class="location-icon"
                                     xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="#F58114"
                                     stroke-width="2.5"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">
                                    <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                                    <circle cx="12" cy="10" r="2.5"/>
                                </svg>
                                Dampskibet
                            </div>
                        </td>
                        <td class="program-emoji">🎵</td>
                    </tr>
                </tbody>
            </table>

        </div>

        <!-- LØRDAG -->

        <div class="day-content saturday">

            <h2 class="day-heading">Lørdag 15. maj 2027</h2>

            <table class="program-tabel">
                <thead>
                    <tr>
                        <th>Tid</th>
                        <th>Aktivitet</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td class="program-tid">10.00</td>
                        <td>
                            <div class="program-aktivitet">
                                Lørdagens aktivitet
                            </div>

                            <div class="program-lokation">
                                <svg class="location-icon"
                                     xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="#F58114"
                                     stroke-width="2.5"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">
                                    <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                                    <circle cx="12" cy="10" r="2.5"/>
                                </svg>
                                Dampskibet
                            </div>
                        </td>
                        <td class="program-emoji">✈️</td>
                    </tr>
                </tbody>
            </table>

        </div>

        <!-- SØNDAG -->

        <div class="day-content sunday">

            <h2 class="day-heading">Søndag 16. maj 2027</h2>

            <table class="program-tabel">
                <thead>
                    <tr>
                        <th>Tid</th>
                        <th>Aktivitet</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td class="program-tid">10.00</td>
                        <td>
                            <div class="program-aktivitet">
                                Søndagens aktivitet
                            </div>

                            <div class="program-lokation">
                                <svg class="location-icon"
                                     xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="#F58114"
                                     stroke-width="2.5"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">
                                    <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
                                    <circle cx="12" cy="10" r="2.5"/>
                                </svg>
                                Dampskibet
                            </div>
                        </td>
                        <td class="program-emoji">🚜</td>
                    </tr>
                </tbody>
            </table>

        </div>

    </div>

</div>

</body>
</html>
